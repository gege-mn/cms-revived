[project]
name = "cms-revived"
version = "0.1.0"
description = "Unicode rework of the 1998 CMs Mongolian fonts by dEgi."
requires-python = ">=3.12"
dependencies = [
    "mongfontbuilder==0.15.3",
    "fonttools>=4.60",
    "ufo2ft>=3.9",
    "ufoLib2>=0.19",
    "uharfbuzz>=0.42",
]

[project.scripts]
cmsr = "cmsr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cmsr"]
