<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CMs ↔ Unicode</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="mark">ᠮ</div>
      <div class="brand-text">
        <h1>CMs <span class="arrow">↔</span> Unicode</h1>
        <p>1998 keyboard forms → Unicode written forms</p>
      </div>
    </div>

    <nav class="tabs" aria-label="Mode">
      <button type="button" data-tab="forms" class="active">Forms</button>
      <button type="button" data-tab="free">Free</button>
    </nav>

    <div class="status">
      <span id="progress" class="progress">0 / 0</span>
      <span id="saved" class="saved">not saved yet</span>
    </div>
  </header>

  <main>
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <input id="search" type="search" placeholder="Search letter, position…" autocomplete="off">
        <div class="side-toggles">
          <label><input type="checkbox" id="defaults-only" checked> defaults only</label>
          <label><input type="checkbox" id="hide-done"> hide done</label>
        </div>
      </div>
      <div class="list" id="list" role="listbox" aria-label="Forms"></div>
      <div class="side-foot" id="side-foot"></div>
    </aside>

    <section class="work">
      <div id="forms-view" class="view">
        <div class="panes">
          <article class="pane">
            <div class="pane-head">
              <span class="eyebrow">Reference</span>
              <span class="chip" id="ref-pos"></span>
            </div>
            <div class="stage" id="ref-stage"></div>
            <div class="pane-foot">
              <div class="meta-line" id="ref-meta"></div>
              <div class="codepoints" id="ref-codepoints"></div>
            </div>
          </article>

          <article class="pane">
            <div class="pane-head">
              <span class="eyebrow">CMs</span>
              <select id="family" title="Which cut to draw with"></select>
            </div>
            <div class="stage" id="cms-stage"></div>
            <div class="pane-foot">
              <input id="legacy" class="legacy-input" type="text" spellcheck="false"
                     autocomplete="off" autocapitalize="off" placeholder="type the CMs keys…">
              <div class="keys" id="keys"></div>
              <div class="pane-options">
                <label class="toggle"><input type="checkbox" id="order" checked> first key on top</label>
                <label class="toggle"><input type="checkbox" id="show-invisibles"> show blanks</label>
                <button type="button" id="clear" class="link">clear</button>
              </div>
            </div>
          </article>
        </div>

        <div class="verdict">
          <div class="verdict-group">
            <button type="button" data-v="same" class="v same">Same form <kbd>↵</kbd></button>
            <button type="button" data-v="variant" class="v variant">Variant</button>
            <button type="button" data-v="component" class="v component">Component</button>
            <button type="button" data-v="missing" class="v missing">Not in CMs</button>
            <button type="button" data-v="skip" class="v skip">Skip</button>
          </div>
          <input id="note" class="note" type="text" placeholder="note (optional)" autocomplete="off">
          <div class="nav">
            <button type="button" id="prev" title="Previous (Shift+←)">←</button>
            <button type="button" id="next" title="Next (Shift+→)">→</button>
          </div>
        </div>

        <div class="hint">
          Type in the CMs box, then <kbd>↵</kbd> for <em>same form</em>. <kbd>Esc</kbd> clears.
          Everything is written to <code>tools/editor/state/</code> as you go.
        </div>
      </div>

      <div id="free-view" class="view" hidden>
        <div class="free-grid">
          <article class="pane">
            <div class="pane-head"><span class="eyebrow">Unicode</span><span class="chip">reference</span></div>
            <textarea id="free-unicode" class="free-input" spellcheck="false">ᠮᠣᠩᠭᠣᠯ</textarea>
            <div class="free-stage" id="free-unicode-stage"></div>
          </article>
          <article class="pane">
            <div class="pane-head"><span class="eyebrow">CMs</span><span class="chip" id="free-family-label"></span></div>
            <textarea id="free-legacy" class="free-input" spellcheck="false" placeholder="type the CMs keys…"></textarea>
            <div class="free-stage" id="free-legacy-stage"></div>
          </article>
        </div>
        <div class="free-actions">
          <button type="button" id="save-pair" class="v same">Save pair</button>
          <span id="free-saved" class="saved"></span>
        </div>
        <div class="pairs" id="pairs"></div>
      </div>
    </section>
  </main>
</body>
</html>
