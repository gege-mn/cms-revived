story_title = "From pieces to letters"
story_p1 = "CMs is among the most used Mongolian script fonts. Schools teach it, and many people still write with it."
story_p2 = "But CMs predates Unicode. Each key draws a piece of a letter, so to a computer the text is a string of Latin letters: it can't be searched or read aloud, and without the font it is nonsense."
story_p3 = "We mapped dEgi's pieces, unchanged, onto every Unicode letter form. The font picks each letter's shape; you just type Mongolian. Where his pieces didn't meet, the join is built from his own outlines. No letter was drawn anew."
fact_forms = "<b>216</b> letter forms, all from dEgi's pieces"
fact_cases = "<b>{passed}</b> of <b>{total}</b> Unicode shaping tests passed, per font"
fact_goldens = "<b>{goldens}</b> words checked against CMs as typed"
gaps_title = "Not there yet"
gaps_p = "No CMs piece draws ka (U+183A), zra (U+183F), zhi (U+1841) or the birga (U+1800), so 1.0 leaves them out. Your device shows them in another font."

joins_title = "Where the pieces didn't meet"
joins_lead = "Where CMs had no piece for a join, typists used the nearest one. The rework builds those joins from dEgi's own outlines."
joins_1998 = "1998"
joins_now = "Now"
join_arches = "Two arches in a row: the first now takes dEgi's small arch."
join_r = "The r after an arch, joined anew."
join_t = "The looped t fell short of the letter before it. Now it touches."
join_arch_gap = "A hairline gap before an arch, in dEgi's font too. The arch now leads in with a stem."

