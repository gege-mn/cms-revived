faith_title = "Looking for dEgi"
faith_p1 = "dEgi drew this typeface. We have tried to reach him for his permission and have not yet succeeded."
faith_tried_title = "What we have tried"
faith_tried_1 = "We wrote to his email address from the late 1990s. We don't know if it still reaches him."
faith_tried_2 = "An academic who knows of him offered to help find him."
faith_tried_3 = "We found an archived site that seems to have been his, online from the late 1990s to about 2003."
faith_commit_title = "Until we reach him"
faith_commit_1 = "<strong>Free for personal use.</strong> As far as we know, the 1998 fonts were shared on these terms. So is the rework."
faith_commit_2 = "<strong>Not sold.</strong> Nothing from the rework is sold without dEgi's permission."
faith_commit_3 = "<strong>Credit.</strong> Every font names dEgi as the typeface's author, ahead of the rework. The names stay his, marked “Gege … Revived” so the rework isn't mistaken for his 1998 fonts."
faith_commit_4 = "<strong>His call.</strong> Any request from dEgi or his rights holder is honoured promptly: a change of credit, name or terms, or withdrawing the rework."
