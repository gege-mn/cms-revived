story_title = "Des fragments aux lettres"
story_p1 = "La CMs est l'une des polices mongoles les plus utilisées. On l'enseigne à l'école, et beaucoup écrivent encore avec."
story_p2 = "Mais elle précède Unicode. Chaque touche dessine un morceau de lettre : pour l'ordinateur, le texte n'est qu'une suite de lettres latines, introuvable par une recherche, muet pour un lecteur d'écran, illisible sans la police."
story_p3 = "Nous avons associé les fragments de dEgi, intacts, à chaque forme de lettre Unicode. La police choisit la forme ; vous tapez simplement en mongol. Là où ses fragments ne se rejoignaient pas, la liaison est faite de ses propres contours. Aucune lettre n'a été redessinée."
fact_forms = "<b>216</b> formes de lettres, toutes des fragments de dEgi"
fact_cases = "<b>{passed}</b> tests de mise en forme Unicode réussis sur <b>{total}</b>, par police"
fact_goldens = "<b>{goldens}</b> mots comparés à leur saisie en CMs"
gaps_title = "Pas encore là"
gaps_p = "Aucun fragment de la CMs ne dessine ka (U+183A), zra (U+183F), zhi (U+1841) ni le birga (U+1800) : la version 1.0 les laisse de côté. Votre appareil les affiche dans une autre police."

joins_title = "Là où les fragments ne se rejoignaient pas"
joins_lead = "Là où la CMs n'avait pas de fragment pour une liaison, on tapait le plus proche. La refonte construit ces liaisons à partir des contours de dEgi."
joins_1998 = "1998"
joins_now = "Aujourd'hui"
join_arches = "Deux arcs de suite : le premier prend désormais le petit arc de dEgi."
join_r = "Le r après un arc, lié à nouveau."
join_t = "Le t bouclé n'atteignait pas la lettre précédente ; désormais il la touche."
join_arch_gap = "Un filet de jour avant un arc, déjà chez dEgi. L'arc arrive désormais par une hampe."

