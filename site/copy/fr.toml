faith_title = "À la recherche de dEgi"
faith_p1 = "dEgi a dessiné ce caractère. Nous avons cherché à le joindre pour lui demander son autorisation, sans succès pour l'instant."
faith_tried_title = "Ce que nous avons tenté"
faith_tried_1 = "Nous avons écrit à son adresse électronique de la fin des années 1990, sans savoir si elle lui parvient encore."
faith_tried_2 = "Un universitaire qui le connaît de nom a proposé de nous aider."
faith_tried_3 = "Nous avons trouvé dans les archives un site qui semble avoir été le sien, en ligne de la fin des années 1990 à 2003 environ."
faith_commit_title = "Tant que nous ne l'avons pas joint"
faith_commit_1 = "<strong>Gratuit pour un usage personnel.</strong> À notre connaissance, les polices de 1998 étaient diffusées ainsi ; la refonte l'est aussi."
faith_commit_2 = "<strong>Jamais vendu.</strong> Rien de la refonte n'est vendu sans l'autorisation de dEgi."
faith_commit_3 = "<strong>Le crédit.</strong> Chaque police nomme dEgi auteur du caractère, avant la refonte. Les noms restent les siens, marqués « Gege … Revived » pour qu'on ne confonde pas la refonte avec ses polices de 1998."
faith_commit_4 = "<strong>Sa décision.</strong> Toute demande de dEgi ou de ses ayants droit sera suivie sans délai : crédit, nom, conditions, ou retrait de la refonte."
