dl_legacy_title = "Pour les anciens documents"
dl_legacy_desc = "CMs Revived ouvre les anciens fichiers CMs tels quels. On tape sur le clavier de dEgi comme en 1998, et les lettres se lient comme dans les polices Unicode. Ligatures désactivées, c'est exactement sa police de 1998. Les styles dp sont en miroir pour la typographie au plomb, comme les siens."
