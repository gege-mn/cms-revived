# Gege CMs Revived: which 1998 keys draw each Unicode target.
#
# keys    the CMs key sequence that draws it, as typed on the 1998 keyboard
# cuts    per-cut keys where a cut differs, e.g. cuts = { CMSHR = "fx" }
# marks   contours lifted from another key and laid over the keys, e.g. the dusal of N:
#         marks = [{ key = "N", contours = [1], dx = 15, dy = -65 }]
#         contours count from 0 in the key's own order; dx/dy move them, in font units;
#         on = 2 sets the mark on the third key, tooth tip to tooth tip, in every cut
# shift   move a key and everything after it along the stem, in font units, e.g.
#         shift = { "2" = -200 } slides the third key back 200 to tighten a join
# shifts  per-cut shift where a cut differs, e.g. shifts = { CMSHR = { "2" = -164 } }
# drop    teeth cut off the front of a key where the key before already draws them, with
#         the stem leading into them: drop = { "3" = 1 } sets the fourth key from its 2nd tooth
# trim    "end" cuts the stem the last key runs on past its body, "start" the stem the first
#         key leads in with, "both" both: in-word keys carry stubs of nirugu that the start
#         or end of a word (or of a suffix after its gap) should not have
# trims   per-cut trim where a cut differs, e.g. trims = { CMSUB = "start" }
# after   other keys when a given piece comes right before, in any letter:
#         after = { "A.init" = "e" } types the piece "e" when it follows the crown;
#         "@arch" names a group from [groups]; a piece named on its own wins over a group;
#         a rule takes its own shift and trim as a table, for joins no key sequence types:
#         after = { "@arch" = { keys = "-n", shift = { "1" = -350 } } }
#         a rule drawn by hand, as glyph cmsr.<piece>.after.<piece or @group> in
#         drawings/<cut>.ufo, replaces its keys, which stand in until then
# status  todo   not mapped yet; the build leaves it out
#         draft  mapped, waiting for a human eye
#         ok     confirmed
#         new    needs a new drawing in drawings/<cut>.ufo: missing from CMs, or broken
#                there; keys, if any, stand in until it is drawn
#         auto   built from its parts (ligatures, pre-MVS forms, whole forms)
#
# before  the same, when a given piece comes right after: before = { "@arch" = "h" } types the
#         small arch when another arch follows; drawn by hand as cmsr.<piece>.before.<piece or @group>
# groups     named sets of pieces for "after" rules, such as the arch-shaped letters
# pieces     single written units in a joining position: everything is built from these
# mvs        the shape a unit takes before an MVS, where it has one of its own
# ligatures  bow letters and others drawn as one form; "auto" joins the parts as they are
# chars      punctuation, digits and the nirugu, by code point
# forms      any other whole written form drawn differently from its parts
#
# The editor (cmsr editor) rewrites this file; comments other than this header are not kept.

[groups]
arch = ["G.medi", "B.init", "B.medi", "P.init", "P.medi", "G.init", "Gx.init", "Gx.medi", "F.init", "F.medi", "K2.init", "K2.medi", "K.init", "K.medi"]
arch-g = ["G.init", "G.medi", "Gx.init", "Gx.medi"]
arch-bpf = ["B.init", "B.medi", "P.init", "P.medi", "F.init", "F.medi"]
arch-k = ["K.init", "K.medi", "K2.init", "K2.medi"]
arch-p = ["P.init", "P.medi"]
arch-f = ["F.init", "F.medi"]

